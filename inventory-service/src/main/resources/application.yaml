# Config comum a todos os ambientes; conexão e credenciais SÓ por variável de
# ambiente (sem padrão). Local: application-local.yaml (perfil padrão, lê o .env
# da raiz). README.md → "Variáveis de ambiente".
spring:
  application:
    name: inventory-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    data:
      web:
        pageable:
          default-page-size: 10
          max-page-size: 100
          one-indexed-parameters: false
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
        one-indexed-parameters: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

server:
  port: 8084