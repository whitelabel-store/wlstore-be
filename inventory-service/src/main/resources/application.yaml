# Config comum a todos os ambientes; conexão e credenciais SÓ por variável de
# ambiente (sem padrão). Local: application-local.yaml (perfil padrão, lê o .env
# da raiz). README.md → "Variáveis de ambiente".
spring:
  application:
    name: inventory-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    data:
      web:
        pageable:
          default-page-size: 10
          max-page-size: 100
          one-indexed-parameters: false
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
        one-indexed-parameters: false
wlstore:
  outbox:
    enabled: true
    exchange: inventory.events

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

server:
  port: 8084