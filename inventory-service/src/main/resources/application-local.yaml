# Perfil local (padrão): lê o .env da raiz, o mesmo do docker compose
# (docker compose --profile inventory up -d sobe o banco deste serviço).
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${INVENTORY_DB_PORT:5732}/${INVENTORY_POSTGRES_DB:inventorydb}
    username: ${INVENTORY_POSTGRES_USER:admin}
    password: ${INVENTORY_POSTGRES_PASSWORD:admin}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    data:
      web:
        pageable:
          default-page-size: 10
          max-page-size: 100
          one-indexed-parameters: false